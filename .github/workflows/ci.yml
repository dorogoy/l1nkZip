name: ci
on: pull_request

jobs:
  cloud-all:
    timeout-minutes: 5
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the supported floor; 3.13 matches the Docker image runtime.
        python-version: ['3.12', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Check uv.lock freshness
        run: uv lock --check
      - name: test root
        run: |
          make test
        working-directory: .
