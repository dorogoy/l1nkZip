name: uv.lock auto-refresh

# Keeps uv.lock in sync with pyproject.toml. Two paths:
#  1. push to master: heal any staleness left by a merge (e.g. a release-please
#     PR merged before its lock refresh landed, or manual version edits).
#  2. pull_request: refresh the release-please branch, whose pyproject.toml
#     version bump would otherwise fail the required 'uv lock --check' CI step.
#     Contributor and Dependabot branches are intentionally untouched: a stale
#     lock on those must fail the check, not be silently papered over.
#
# The refresh commit is pushed with the GH_PAT (the same token release-please
# uses), NOT the workflow's GITHUB_TOKEN. A GITHUB_TOKEN push leaves the
# follow-up ci run on the release branch stuck in 'action_required', so the
# release PR stayed red until someone approved the run manually — observed on
# every release between 2026-09-14 and 2026-09-18. PAT pushes trigger ci
# normally (release-please's own pushes already prove this) and the bounded
# chain terminates: the re-triggered workflows find a fresh lock and exit
# without pushing anything.
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: write

concurrency:
  group: uv-lock-refresh-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    timeout-minutes: 5
    runs-on: ubuntu-22.04
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.ref == 'release-please--branches--master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # On pull_request events, check out the PR head so the refresh can be
          # pushed back to its branch (master pushes use the default ref).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Refresh uv.lock if stale
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if uv lock --check; then
            echo "uv.lock is fresh, nothing to do."
            exit 0
          fi
          uv lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: refresh uv.lock after pyproject.toml change"
          # Push with the PAT (see header comment): a GITHUB_TOKEN push would
          # leave the follow-up ci run in 'action_required'. Detached HEAD
          # (PR-head checkout) needs an explicit push target either way.
          git push "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${{ github.event.pull_request.head.ref || 'master' }}"
