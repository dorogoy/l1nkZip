name: Publish Docker image

on:
  release:
    types: [published]
  schedule:
    # Weekly rebuild of :latest so base layers pick up fresh security
    # patches even when no release happens. Version tags are not touched.
    - cron: '23 4 * * 1'
  workflow_dispatch:

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: dorogoy/l1nkzip
          # Releases push vX.Y.Z + latest (ref,event=tag + latest=auto flavor).
          # Weekly/dispatch rebuilds on the default branch refresh :latest
          # directly instead of creating a :master tag.
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            latest=auto

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
